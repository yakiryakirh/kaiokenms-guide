name: Build public database data

on:
  push:
    branches: [main]
    paths:
      - tools/build_public_database_bundle.py
      - .github/workflows/build-public-database.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: public-database-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KaiokenMS main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout v83 WEB source
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/andrenogrib/gms_v83_wztoweb.git source
          cd source
          git sparse-checkout set WEB

      - name: Download PRE V4 Quest and Map source pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pack
          gh run download 32660968109 -n pre-v4-data-pack -D pack
          test -f pack/map-links.json
          test -f pack/Quest.wz/QuestInfo.img.xml
          test -d pack/Map.wz

      - name: Build public database data
        run: |
          python tools/build_public_database_bundle.py --web source/WEB --pack pack --out data

      - name: Validate generated data
        shell: bash
        run: |
          set -euo pipefail
          test -s data/db-index.js
          test -s data/map-spatial.js
          test -s data/item-relations.js
          python - <<'PY'
          import json,re
          from pathlib import Path
          idx=json.loads(Path('data/db-index.json').read_text())
          spatial=json.loads(Path('data/map-spatial.json').read_text())
          rel=json.loads(Path('data/item-relations.json').read_text())
          assert len(idx['maps']) >= 5260
          assert len(idx['mobs']) >= 1500
          assert len(idx['npcs']) >= 1200
          assert len(idx['quests']) >= 2800
          assert len(rel['itemDrops']) >= 3000
          assert '100000000' in spatial['maps']
          for n in idx['npcs']:
              assert n.get('name') and not re.fullmatch(r'\d+',str(n['name']))
          for mid,m in spatial['maps'].items():
              assert m.get('image')
              for p in m.get('portals',[]):
                  assert str(p.get('targetMapId','')) not in ('','999999999',str(mid))
                  assert p.get('targetMapName')
          print(idx['meta'])
          print('drop items',len(rel['itemDrops']))
          print('validated maps',len(spatial['maps']))
          PY

      - name: Commit generated data only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/db-index.js data/db-index.json data/map-spatial.js data/map-spatial.json data/item-relations.js data/item-relations.json
          if git diff --cached --quiet; then
            echo "No generated data changes"
          else
            git commit -m "Rebuild public v83 database data"
            git push origin main
          fi
