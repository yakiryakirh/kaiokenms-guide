name: Build v83 Image Pack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v83-image-pack.yml'
  pull_request:
    branches: [main]
    paths:
      - 'image-pipeline-trigger.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone GMS v83 source
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/andrenogrib/gms_v83_wztoweb.git source
          cd source
          git sparse-checkout set WEB

      - name: Build image inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, hashlib
          root = Path('source/WEB')
          out = Path('v83-pack')
          out.mkdir(exist_ok=True)
          rows=[]
          exts={'.png','.jpg','.jpeg','.gif','.webp'}
          for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower() in exts:
                  rel=p.relative_to(root).as_posix()
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  rows.append((rel,p.stat().st_size,h))
          with (out/'inventory.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.writer(f)
              w.writerow(['path','size_bytes','sha256'])
              w.writerows(rows)
          print(f'images={len(rows)}')
          PY

      - name: Copy generated WEB database
        run: |
          mkdir -p v83-pack/WEB
          cp -a source/WEB/. v83-pack/WEB/

      - name: Create archive
        run: |
          tar -czf gms-v83-web-pack.tar.gz v83-pack
          du -sh gms-v83-web-pack.tar.gz

      - name: Upload v83 WEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: gms-v83-web-pack
          path: gms-v83-web-pack.tar.gz
          compression-level: 0
          retention-days: 7
