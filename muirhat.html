<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="data/db-index.js?v=1"></script>
  <title>KaiokenMS — Muirhat Eliminate Quests</title>
  <style>
    :root{--bg:#071226;--panel:#172746;--panel2:#20385d;--gold:#ffd54a;--orange:#ff8a00;--cyan:#86dcff;--text:#f8fbff;--muted:#b9c7da;--line:#35547c}
    *{box-sizing:border-box}body{margin:0;color:var(--text);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;line-height:1.55;background:radial-gradient(circle at 15% 12%,rgba(50,168,255,.13),transparent 18%),linear-gradient(180deg,#030711,#081226 42%,#050914);background-attachment:fixed}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.4px);background-size:92px 92px;z-index:-1}.site-nav{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:18px 24px;border-bottom:3px solid var(--orange);background:#0b1424}.site-nav a{color:var(--text);text-decoration:none;font-weight:900;border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:#172a4a}.site-nav a:hover{border-color:var(--orange);color:var(--gold)}.wrap{max-width:1120px;margin:auto;padding:34px 20px 90px}h1,h2{color:var(--gold);text-transform:uppercase}h1{font-size:clamp(2rem,5vw,4rem);margin:.2em 0}.intro{color:var(--muted);margin-bottom:24px}.level{margin:24px 0;padding:24px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,rgba(19,34,61,.97),rgba(8,17,34,.97))}.quest{margin:14px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:rgba(4,10,20,.5)}.qhead{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:13px 16px;background:linear-gradient(90deg,var(--panel2),#142642)}.qtitle{font-size:1.15rem;font-weight:900}.lvl{background:var(--orange);border-radius:999px;padding:4px 11px;font-weight:900;white-space:nowrap}.qbody{padding:15px}.row{display:grid;grid-template-columns:120px 1fr;gap:10px;margin:7px 0}.label{color:var(--cyan);font-weight:900}.reward{color:var(--gold);font-weight:900}.where{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding:12px;border-left:4px solid var(--orange);background:#13243a;color:var(--muted)}.where b{color:var(--gold);width:100%}.where a{color:var(--cyan);font-weight:900}.empty{padding:20px;border:1px solid var(--line);border-radius:10px;color:var(--muted)}@media(max-width:650px){.site-nav{flex-wrap:wrap}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <nav class="site-nav"><a href="index.html">🏠 Home</a><a href="quests.html">📜 Quest Guide</a><a href="database.html">🗃️ Database</a></nav>
  <main class="wrap"><h1>Muirhat / Golem Chain</h1><p class="intro">The Muirhat eliminate route, collected into one page so every stage is easy to find. Start the hidden prerequisite beside Muirhat in-game.</p><div id="muirhat-quests"></div></main>
  <script>
    (()=>{
      const wanted=['eliminate the stone golems','eliminate dark stone golem','eliminate mixed stone golem','eliminate skeletons','eliminate drakes','eliminate tauromacis'];
      const quests=window.KAIOKEN_DB_INDEX?.quests||[];
      const image=v=>v&&/^https?:|^data:|^\//.test(v)?v:`https://raw.githubusercontent.com/andrenogrib/gms_v83_wztoweb/refs/heads/main/WEB/${String(v||'').replace(/^\//,'')}`;
      const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const found=wanted.map(name=>quests.find(q=>String(q.name||'').toLowerCase()===name)).filter(Boolean);
      const root=document.getElementById('muirhat-quests');
      if(!found.length){root.innerHTML='<p class="empty">The Muirhat eliminate quests are not present in the local database index.</p>';return}
      const groups=new Map();found.forEach(q=>{const key=q.lvmin||q.lvmax||'Any';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(q)});
      for(const [level,list] of groups){const section=document.createElement('section');section.className='level';section.innerHTML=`<h2>Levels ${esc(level)}${list[0].lvmax?`-${esc(list[0].lvmax)}`:''}</h2>`;list.forEach(q=>{const loc=q.startLocations?.[0]||{},npc=q.startNpcName||q.startNpc||'Muirhat',map=loc.mapName||'Not listed';const npcRow=(window.KAIOKEN_DB_INDEX?.npcs||[]).find(n=>String(n.name).toLowerCase()===String(npc).toLowerCase());const card=document.createElement('article');card.className='quest';card.innerHTML=`<div class="qhead"><span class="qtitle">${esc(q.name)}</span><span class="lvl">Lv. ${esc(q.lvmin||'Any')}${q.lvmax&&q.lvmax!==q.lvmin?`–${esc(q.lvmax)}`:''}</span></div><div class="qbody"><div class="row"><div class="label">NPC</div><div>${esc(npc)}</div></div><div class="row"><div class="label">Objective</div><div>${esc(q.summary||q.progressText||'Complete the elimination objective.')}</div></div><div class="row"><div class="label">Reward</div><div class="reward">${q.exp?`${esc(q.exp)} EXP`:''}${q.fame?` + ${esc(q.fame)} Fame`:''}</div></div><div class="where"><b>📍 Where to start</b><span>${npcRow?.preview?`<img src="${image(npcRow.preview)}" alt="${esc(npc)}" style="width:42px;height:42px;object-fit:contain;vertical-align:middle">`:''} NPC: ${esc(npc)}</span><a href="database.html?openMap=${encodeURIComponent(loc.mapId||'')}">Map: ${esc(map)} →</a></div></div>`;section.appendChild(card)});root.appendChild(section)}
    })();
  </script>
  <script src="site-navigation.js?v=15"></script>
</body>
</html>
