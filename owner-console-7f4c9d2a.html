<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>KaiokenMS Owner Console</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#153968,#071022 45%,#030711);color:#f8fbff;font-family:Trebuchet MS,Segoe UI,Arial,sans-serif}.box{width:min(520px,92%);padding:34px;border:1px solid #3d6594;border-radius:24px;background:linear-gradient(145deg,#1a3153,#0d1a30);box-shadow:0 25px 70px #0009;text-align:center}.mark{font-size:3rem}h1{margin:.25em 0;color:#ffd54a}p{color:#b9c7da}button{margin-top:14px;padding:13px 20px;border:1px solid #ff8a00;border-radius:999px;background:linear-gradient(145deg,#4a2608,#241105);color:#fff;font-weight:900;font-size:1rem;cursor:pointer}#status{min-height:1.5em;margin-top:14px;color:#86dcff}</style></head><body><main class="box"><div class="mark">🔐</div><h1>Private Owner Console</h1><p>This management area is restricted to its registered owner.</p><button id="login" type="button">Continue with Discord</button><div id="status">Checking access…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const CONFIG=window.KAIOKEN_DATABASE_CONFIG||{};
const api="https://rxjsdnbixzsxvbzqmmki.supabase.co/functions/v1/kaioken-owner-console-7f4c9d2a";
const db=supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const statusEl=document.getElementById("status"),login=document.getElementById("login");let loading=false;
async function openConsole(session){if(loading||!session)return;loading=true;statusEl.textContent="Verifying owner access…";try{const {data:isOwner,error}=await db.rpc("guide_is_owner");if(error||isOwner!==true){statusEl.textContent="Access unavailable for this Discord account.";login.hidden=false;loading=false;return}location.replace("owner-console-app-7f4c9d2a.html")}catch(error){console.error(error);statusEl.textContent="Could not verify access. Please refresh and try again.";login.hidden=false;loading=false}}
async function boot(){const {data}=await db.auth.getSession();if(data.session)return openConsole(data.session);statusEl.textContent="Sign in with the owner Discord account.";login.hidden=false}
login.onclick=async()=>{login.hidden=true;statusEl.textContent="Opening Discord…";const {error}=await db.auth.signInWithOAuth({provider:"discord",options:{redirectTo:location.href.split("#")[0]}});if(error){statusEl.textContent=error.message;login.hidden=false}};
db.auth.onAuthStateChange((_event,session)=>{if(session)openConsole(session)});boot();
</script></body></html>
